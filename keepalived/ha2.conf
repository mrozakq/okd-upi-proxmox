global_defs {
  enable_script_security
}
vrrp_script chk_haproxy {
  script "/usr/bin/pidof haproxy" # check the haproxy process
  interval 2 # every 2 seconds
  weight 60 # add 60 points if OK
}
vrrp_instance VI_1 {
    state BACKUP
    interface ens18
    virtual_router_id 101
    priority 100
    advert_int 1
    authentication {
        auth_type PASS
        auth_pass ZMIEN_MNIE
    }
    virtual_ipaddress {
        172.18.22.63/24
    }
   track_script {
    chk_haproxy
  }
}
